<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>हिंदी भाषा की विकास यात्रा</title>
<meta name="theme-color" content="#EFE7D8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#EFE7D8; --card:#F7F1E4; --ink:#2B211B; --ink-soft:#6B5F4F;
  --maroon:#7C2D2D; --green:#33473A; --line:#D9CBB0; --max:780px;
}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Noto Sans Devanagari',sans-serif;font-size:17px;line-height:1.7;overflow-x:hidden;word-wrap:break-word;}
img{display:block;max-width:100%;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--maroon);outline-offset:3px;}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px;}

.hero{padding:56px 0 34px;text-align:center;border-bottom:1px solid var(--line);}
.hero .kicker{font-size:13px;color:var(--maroon);letter-spacing:0.02em;margin:0 0 10px;}
.hero h1{font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.25;margin:0 0 16px;}
.hero p.sub{max-width:44ch;margin:0 auto;color:var(--ink-soft);font-size:16px;}
.hero .organiser{margin-top:22px;font-size:14px;color:var(--ink-soft);}

.timeline{display:flex;justify-content:center;padding:26px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.timeline a{text-decoration:none;color:var(--ink);padding:10px 22px;border-right:1px solid var(--line);text-align:center;font-size:14px;}
.timeline a:last-child{border-right:0;}
.timeline .yr{display:block;color:var(--maroon);font-size:12px;margin-bottom:3px;}
.timeline .lb{font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:17px;}

.era{padding:62px 0;border-bottom:1px solid var(--line);scroll-margin-top:16px;}
.era:last-of-type{border-bottom:0;}
.era-head{margin-bottom:22px;}
.era-head .yr{color:var(--maroon);font-size:13px;display:block;margin-bottom:6px;}
.era-head h2{font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:clamp(30px,6.6vw,40px);margin:0 0 4px;}
.era-head .subtitle{color:var(--green);font-size:15px;font-weight:500;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:22px 24px;margin-bottom:28px;}
.panel p{margin:0 0 12px;}
.panel p:last-child{margin-bottom:0;}
.panel ul{margin:10px 0 16px;padding-left:20px;}
.panel li{margin-bottom:6px;}
.panel strong{color:var(--maroon);}
.panel h3{font-family:'Noto Serif Devanagari',serif;font-size:19px;margin:18px 0 8px;color:var(--green);}
.panel h3:first-child{margin-top:0;}

.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:28px;}
.gallery button{padding:0;display:block;grid-column:span 3;cursor:zoom-in;transition:opacity .15s;}
.gallery button:hover{opacity:.85;}
.gallery button:first-child{grid-column:span 6;}
.gallery img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;background:#E3D9C4;border-radius:2px;}
.gallery button:first-child img{aspect-ratio:16/9;}
.gallery-empty{font-size:14px;color:var(--ink-soft);padding:20px;text-align:center;border:1px dashed var(--line);margin-bottom:28px;}
@media (max-width:520px){
  .gallery{grid-template-columns:repeat(4,1fr);}
  .gallery button{grid-column:span 2;}
  .gallery button:first-child{grid-column:span 4;}
}

.audio-list{display:flex;flex-direction:column;gap:10px;}
.track{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:2px;}
.track .pp{width:42px;height:42px;flex:none;border-radius:50%;background:var(--maroon);color:#F7F1E4;display:grid;place-items:center;}
.track .pp svg{width:15px;height:15px;}
.track .pp .ic-pause{display:none;}
.track.playing .pp .ic-play{display:none;}
.track.playing .pp .ic-pause{display:block;}
.track .body{flex:1;min-width:0;}
.track .name{font-weight:500;font-size:15px;margin:0 0 4px;}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;display:block;}
.seek::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line);}
.seek::-moz-range-track{height:3px;border-radius:2px;background:var(--line);}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--maroon);margin-top:-5px;}
.seek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--maroon);border:0;}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

.lb{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.94);display:none;place-items:center;padding:20px;}
.lb.open{display:grid;}
.lb img{max-width:100%;max-height:82vh;object-fit:contain;}
.lb-close{position:absolute;top:12px;right:16px;color:#F7F1E4;font-size:28px;padding:8px;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#F7F1E4;font-size:30px;padding:16px 12px;}
.lb-prev{left:2px;} .lb-next{right:2px;}

footer{padding:50px 0 60px;text-align:center;font-size:13px;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="hero wrap">
  <p class="kicker">हिंदी भाषा प्रदर्शनी</p>
  <h1>हिंदी भाषा की विकास यात्रा</h1>
  <p class="sub">आदिकाल से आधुनिक काल तक — हिंदी साहित्य की यात्रा को सुनें और देखें।</p>
  <p class="organiser"><!-- EDIT: आयोजक का नाम / संस्था यहाँ लिखें --></p>
</header>

<nav class="timeline wrap" id="timelineNav"></nav>
<main id="eras"></main>
<footer>हिंदी भाषा की विकास यात्रा</footer>

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="फ़ोटो देखें">
  <button class="lb-close" id="lbClose" aria-label="बंद करें">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="पिछली फ़ोटो">&lsaquo;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="अगली फ़ोटो">&rsaquo;</button>
</div>

<script src="config.js"></script>
<script>
const CONTENT = {
  aadikaal: `
    <h3>परिचय</h3>
    <p>हिंदी साहित्य के आरंभिक काल को <strong>आदिकाल</strong> कहा जाता है। आचार्य रामचंद्र शुक्ल ने इसे <strong>वीरगाथा काल</strong> भी कहा, क्योंकि इस दौर की रचनाओं में राजाओं की वीरता और युद्धों का सजीव वर्णन मिलता है।</p>
    <h3>मुख्य विशेषताएँ</h3>
    <ul>
      <li>वीर रस की प्रधानता — कविताएँ सुनकर सैनिकों में जोश भर जाता था</li>
      <li>राजदरबारी कवि परंपरा — कवि राजाओं के आश्रय में रहते थे</li>
      <li>युद्धों और शौर्य का रोमांचक, सजीव चित्रण</li>
    </ul>`,
  bhaktikaal: `
    <h3>परिचय</h3>
    <p>इसे हिंदी साहित्य का <strong>स्वर्ण युग</strong> माना जाता है। इस दौरान लोक-कल्याण, समानता और उच्च कोटि के साहित्य की रचना हुई। यह मुख्यतः दो धाराओं में विभाजित है।</p>
    <h3>निर्गुण काव्यधारा (ईश्वर का निराकार रूप)</h3>
    <ul>
      <li><strong>ज्ञानमार्गी शाखा</strong> — प्रमुख कवि: कबीरदास (रचना: बीजक)</li>
      <li><strong>प्रेममार्गी शाखा</strong> — प्रमुख कवि: मलिक मोहम्मद जायसी (रचना: पद्मावत)</li>
    </ul>
    <h3>सगुण काव्यधारा (ईश्वर का साकार रूप)</h3>
    <ul>
      <li><strong>रामभक्ति शाखा</strong> — गोस्वामी तुलसीदास (रचना: रामचरितमानस)</li>
      <li><strong>कृष्णभक्ति शाखा</strong> — सूरदास (सूरसागर) और मीराबाई (पदावली)</li>
    </ul>`,
  aadhunikkaal: `
    <h3>परिचय</h3>
    <p>1850 ई. के बाद का समय <strong>आधुनिक काल</strong> कहलाता है, जिसे साहित्यिक प्रवृत्तियों के आधार पर कई युगों में बाँटा गया है।</p>
    <ul>
      <li><strong>भारतेंदु युग</strong> (1850–1900) — राष्ट्रीय चेतना व सामाजिक सुधार; भारतेंदु हरिश्चंद्र</li>
      <li><strong>द्विवेदी युग</strong> (1900–1918) — खड़ी बोली हिंदी का परिमार्जन</li>
      <li><strong>छायावादी युग</strong> (1918–1936) — जयशंकर प्रसाद, सूर्यकांत त्रिपाठी 'निराला', सुमित्रानंदन पंत, महादेवी वर्मा</li>
      <li><strong>प्रगतिवादी युग</strong> (1936–1943) — रामधारी सिंह 'दिनकर', नागार्जुन</li>
      <li><strong>प्रयोगवाद एवं नई कविता</strong> (1943–वर्तमान) — अज्ञेय, गजानन माधव 'मुक्तिबोध'</li>
    </ul>`
};

const nav = document.getElementById('timelineNav');
const main = document.getElementById('eras');
const galleryImages = {};
const audioEls = {};

ERAS.forEach(era => {
  const a = document.createElement('a');
  a.href = '#' + era.id;
  a.innerHTML = `<span class="yr">${era.years}</span><span class="lb">${era.label}</span>`;
  nav.appendChild(a);

  const sec = document.createElement('section');
  sec.className = 'era';
  sec.id = era.id;
  sec.innerHTML = `
    <div class="wrap">
      <div class="era-head">
        <span class="yr">${era.years}</span>
        <h2>${era.label}</h2>
        <div class="subtitle">${era.subtitle}</div>
      </div>
      <div class="panel">${CONTENT[era.id] || ''}</div>
      <div class="gallery" id="gal-${era.id}"></div>
      <div class="audio-list" id="aud-${era.id}"></div>
    </div>`;
  main.appendChild(sec);
  galleryImages[era.id] = [];
});

function fmt(s){ if(!isFinite(s)||s<0) return "0:00"; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }

function renderGallery(eraId, items){
  const el = document.getElementById('gal-' + eraId);
  galleryImages[eraId] = items.map(d => d.path);
  if(!items.length){ el.className = 'gallery-empty'; el.textContent = 'इस भाग की तस्वीरें जल्द जोड़ी जाएँगी।'; return; }
  el.className = 'gallery';
  el.innerHTML = '';
  items.forEach((d, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label','फ़ोटो देखें');
    const img = document.createElement('img');
    img.src = d.path; img.loading = 'lazy'; img.alt = '';
    b.appendChild(img);
    b.addEventListener('click', () => openLightbox(eraId, i));
    el.appendChild(b);
  });
}

function renderAudio(eraId, items){
  const el = document.getElementById('aud-' + eraId);
  el.innerHTML = '';
  items.forEach((d,i) => {
    const key = eraId + '-' + i;
    const row = document.createElement('div');
    row.className = 'track';
    row.innerHTML = `
      <button class="pp" aria-label="चलाएँ">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
      </button>
      <div class="body">
        <p class="name">${d.name || 'गीत'}</p>
        <input class="seek" type="range" min="0" max="1000" value="0">
        <div class="times"><span class="cur">0:00</span><span class="dur">0:00</span></div>
      </div>`;
    el.appendChild(row);
    const audio = new Audio(d.path);
    audio.preload = 'metadata';
    audioEls[key] = audio;
    const pp = row.querySelector('.pp'), seek = row.querySelector('.seek');
    const cur = row.querySelector('.cur'), dur = row.querySelector('.dur');
    let dragging = false;
    pp.addEventListener('click', () => {
      if(audio.paused){ Object.values(audioEls).forEach(a => { if(a!==audio) a.pause(); }); audio.play().catch(()=>{}); }
      else audio.pause();
    });
    audio.addEventListener('play', ()=>row.classList.add('playing'));
    audio.addEventListener('pause', ()=>row.classList.remove('playing'));
    audio.addEventListener('ended', ()=>{seek.value=0;cur.textContent='0:00';});
    audio.addEventListener('loadedmetadata', ()=>{dur.textContent=fmt(audio.duration);});
    audio.addEventListener('timeupdate', ()=>{ if(dragging||!audio.duration) return; seek.value=(audio.currentTime/audio.duration)*1000; cur.textContent=fmt(audio.currentTime); });
    seek.addEventListener('input', ()=>{dragging=true; if(audio.duration) cur.textContent=fmt(audio.duration*seek.value/1000);});
    seek.addEventListener('change', ()=>{if(audio.duration) audio.currentTime = audio.duration*seek.value/1000; dragging=false;});
  });
}

fetch('manifest.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('no manifest'); return r.json(); })
  .then(manifest => {
    ERAS.forEach(era => {
      const e = manifest[era.id] || { images: [], audio: [] };
      renderGallery(era.id, e.images || []);
      renderAudio(era.id, e.audio || []);
    });
  })
  .catch(() => {
    ERAS.forEach(era => {
      const g = document.getElementById('gal-' + era.id);
      g.className = 'gallery-empty';
      g.textContent = 'तस्वीरें जल्द जोड़ी जाएँगी।';
    });
  });

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
let lbEra = null, lbIndex = 0;
function openLightbox(eraId, i){lbEra=eraId; lbIndex=i; lbImg.src=galleryImages[eraId][i]; lb.classList.add('open');}
function closeLightbox(){lb.classList.remove('open'); lbImg.src='';}
function step(d){ const arr = galleryImages[lbEra]; lbIndex=(lbIndex+d+arr.length)%arr.length; lbImg.src=arr[lbIndex]; }
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', e=>{e.stopPropagation();step(-1);});
document.getElementById('lbNext').addEventListener('click', e=>{e.stopPropagation();step(1);});
lb.addEventListener('click', e=>{if(e.target===lb||e.target===lbImg) closeLightbox();});
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
</script>
</body>
</html>
